<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0a0907" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="4" />

  <!-- Outer Vinyl Groove circles -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Sound Waves (Spectrum bars behind headphones) -->
  <g opacity="0.6">
    <rect x="180" y="240" width="8" height="32" rx="4" fill="url(#gold)" />
    <rect x="200" y="220" width="8" height="72" rx="4" fill="url(#gold)" />
    <rect x="220" y="200" width="8" height="112" rx="4" fill="url(#gold)" />
    <rect x="240" y="180" width="8" height="152" rx="4" fill="url(#gold)" />
    <rect x="264" y="180" width="8" height="152" rx="4" fill="url(#gold)" />
    <rect x="284" y="200" width="8" height="112" rx="4" fill="url(#gold)" />
    <rect x="304" y="220" width="8" height="72" rx="4" fill="url(#gold)" />
    <rect x="324" y="240" width="8" height="32" rx="4" fill="url(#gold)" />
  </g>

  <!-- Glowing Headphones Symbol -->
  <g filter="url(#glow)">
    <!-- Headband Arch -->
    <path d="M 128 270 A 128 128 0 0 1 384 270" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round" />
    <path d="M 148 270 A 108 108 0 0 1 364 270" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="4" stroke-linecap="round" />

    <!-- Left Ear Cup -->
    <rect x="96" y="250" width="56" height="100" rx="28" fill="url(#gold)" />
    <rect x="110" y="265" width="28" height="70" rx="14" fill="#0a0907" />

    <!-- Right Ear Cup -->
    <rect x="360" y="250" width="56" height="100" rx="28" fill="url(#gold)" />
    <rect x="374" y="265" width="28" height="70" rx="14" fill="#0a0907" />
  </g>

  <!-- Hi-Res Audio Text Badge -->
  <rect x="176" y="380" width="160" height="36" rx="8" fill="#14120e" stroke="url(#gold)" stroke-width="2" />
  <text x="256" y="404" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">HI-RES DAC</text>
</svg>
